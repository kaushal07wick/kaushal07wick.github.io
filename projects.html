<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    // apply saved theme before first paint to avoid theme flash
    if ((localStorage.getItem("theme") || "light") !== "dark") document.documentElement.classList.add("light");
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects — Kaushal</title>

  <link rel="stylesheet" href="/tailwind.css?v=1" />
  <script src="header.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --bg: #14100d;
      --text: #e3d9cc;
      --accent: #c97c5d;
      --border: rgba(201, 124, 93, 0.20);
      --card-bg: rgba(201, 124, 93, 0.03);
      --shadow: rgba(201, 124, 93, 0.20);
    }
    .light {
      --bg: #faf6f0;
      --text: #2e211a;
      --accent: #b15c3c;
      --border: rgba(177, 92, 60, 0.25);
      --card-bg: rgba(177, 92, 60, 0.04);
      --shadow: rgba(177, 92, 60, 0.20);
    }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "JetBrains Mono", monospace;
      min-height: 100%;
    }

    /* ── HERO (matches blog/about) ─────────────────────── */
    .meta-bar {
      font-size: 11.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.75;
      margin-top: 32px;
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      align-items: center;
    }
    .meta-bar .k { opacity: 0.5; margin-right: 4px; }
    .meta-bar .v { color: var(--accent); }
    .meta-bar .sep { opacity: 0.25; }
    .meta-bar .pulse-dot {
      display: inline-block;
      width: 7px; height: 7px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
      margin-right: 4px;
      animation: dot-pulse 1.6s ease-in-out infinite;
    }
    @keyframes dot-pulse {
      0%, 100% { opacity: 0.5; box-shadow: 0 0 4px var(--accent); }
      50%      { opacity: 1; box-shadow: 0 0 14px var(--accent); }
    }

    .proj-title {
      font-size: clamp(44px, 9vw, 88px);
      font-weight: 700;
      letter-spacing: 0.10em;
      color: var(--accent);
      line-height: 1;
      margin: 0;
      text-shadow: 0 0 28px rgba(201, 124, 93,0.30);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .proj-title .blink-bar {
      display: inline-block;
      width: 14px;
      height: clamp(38px, 7vw, 68px);
      background: var(--accent);
      box-shadow: 0 0 18px var(--accent);
      animation: bar-blink 1.05s steps(2) infinite;
    }
    @keyframes bar-blink { 50% { opacity: 0; } }

    .proj-sub {
      margin-top: 18px;
      opacity: 0.78;
      line-height: 1.7;
      max-width: 60ch;
      font-size: 14.5px;
    }
    .proj-sub .accent { color: var(--accent); }

    .stat-bar {
      margin-top: 22px;
      font-size: 12px;
      letter-spacing: 0.05em;
      color: var(--accent);
      opacity: 0.85;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }
    .stat-bar .n { font-weight: 600; }
    .stat-bar .label { opacity: 0.6; }
    .stat-bar .sep { opacity: 0.35; }

    .controls {
      margin-top: 22px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .grep-prompt { color: var(--accent); font-size: 13px; opacity: 0.85; user-select: none; }
    #proj-grep {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 12px;
      font-family: inherit;
      font-size: 13px;
      border-radius: 4px;
      flex: 0 0 320px;
      max-width: 100%;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    #proj-grep::placeholder { color: var(--text); opacity: 0.35; }
    #proj-grep:focus {
      border-color: var(--accent);
      box-shadow: 0 0 14px rgba(201, 124, 93,0.18);
      background: rgba(201, 124, 93,0.03);
    }
    .controls .hint { font-size: 11px; opacity: 0.45; letter-spacing: 0.04em; }

    /* ── GRID + CARDS ──────────────────────────────────── */
    .grid-wrap {
      position: relative;
      margin-top: 32px;
      overflow: hidden;
    }
    .grid-wrap::before {
      /* horizontal scan beam drifting down (same trick as blog) */
      content: "";
      position: absolute;
      left: 0; right: 0;
      top: -90px;
      height: 90px;
      pointer-events: none;
      background: linear-gradient(to bottom, transparent, rgba(201, 124, 93,0.08), transparent);
      filter: blur(7px);
      animation: scan-beam 13s linear infinite;
      z-index: 2;
    }
    @keyframes scan-beam {
      0%   { transform: translateY(0); opacity: 0; }
      8%   { opacity: 1; }
      92%  { opacity: 1; }
      100% { transform: translateY(140vh); opacity: 0; }
    }

    .proj-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 40px 44px;
    }

    .proj-card {
      position: relative;
      padding: 6px 0 2px;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      transition: transform .25s ease;
    }
    .proj-card:hover { transform: translateY(-2px); }
    .proj-card:hover .pc-name { color: var(--accent); }
    .pc-name { transition: color .2s ease; }

    /* head: language dot + name + status */
    .pc-head {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 13px;
    }
    .pc-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      flex: none;
      background: currentColor;
      box-shadow: 0 0 9px currentColor;
    }
    .pc-name {
      font-size: 21px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.01em;
      line-height: 1.1;
    }
    .pc-status {
      margin-left: auto;
      font-size: 9.5px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.55;
      white-space: nowrap;
    }
    .pc-status.active  { color: #7faf6a; }
    .pc-status.shipped { color: var(--accent); }
    .pc-status.wip     { color: #d4a94a; }

    .pc-intro {
      opacity: 0.72;
      line-height: 1.6;
      font-size: 13.5px;
    }

    /* meta: language + tags as quiet middot-separated text */
    .pc-meta {
      margin-top: auto;
      padding-top: 16px;
      font-size: 12px;
      letter-spacing: 0.02em;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
    }
    .pc-meta .lang { color: var(--accent); }
    .pc-meta .tag  { opacity: 0.5; }
    .pc-meta .mid  { opacity: 0.28; }

    /* footer: repo slug + open link */
    .pc-foot {
      margin-top: 14px;
      padding-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 11.5px;
    }
    .pc-slug {
      opacity: 0.42;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .pc-open {
      color: var(--accent);
      opacity: 0.75;
      letter-spacing: 0.05em;
      white-space: nowrap;
      transition: opacity .2s;
    }
    .pc-open .arr { display: inline-block; transition: transform .25s ease; }
    .proj-card:hover .pc-open { opacity: 1; }
    .proj-card:hover .pc-open .arr { transform: translate(2px, -2px); }

    /* anim */
    .pc-anim-init { opacity: 0; transform: translateY(14px); }
    .pc-anim-in {
      opacity: 1; transform: translateY(0);
      transition: opacity 0.55s ease, transform 0.55s ease;
    }

    .proj-card.proj-hidden { display: none; }

    @media (prefers-reduced-motion: reduce) {
      .grid-wrap::before { display: none; }
      .pc-anim-init { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>

<div class="max-w-6xl mx-auto px-6">
  <div id="header-container"></div>

  <!-- HERO -->
  <section>
    <div class="meta-bar">
      <span><span class="k">file</span><span class="v">~/projects/manifest.json</span></span>
      <span class="sep">·</span>
      <span><span class="k">repo-host</span><span class="v">github</span></span>
      <span class="sep">·</span>
      <span><span class="pulse-dot"></span><span class="v">all systems nominal</span></span>
    </div>

    <h1 class="proj-title">PROJECTS<span class="blink-bar"></span></h1>

    <p class="proj-sub">
      <span class="accent">things i've built</span> — agents, ML systems, and tools.
    </p>

    <div class="stat-bar">
      <span><span class="n" id="ps-count">--</span> <span class="label">repositories</span></span>
      <span class="sep">·</span>
      <span><span class="n" id="ps-active">--</span> <span class="label">active</span></span>
      <span class="sep">·</span>
      <span><span class="n" id="ps-langs">--</span> <span class="label">languages</span></span>
      <span class="sep">·</span>
      <span><span class="label">primary</span> <span class="n" id="ps-primary">—</span></span>
    </div>

    <div class="controls">
      <span class="grep-prompt">grep:</span>
      <input id="proj-grep" type="text" placeholder="filter by name, tag, or language..." autocomplete="off" spellcheck="false" />
      <span class="hint">type to filter · esc to clear</span>
    </div>
  </section>

  <!-- GRID -->
  <section class="grid-wrap">
    <div id="proj-grid" class="proj-grid"></div>
  </section>
</div>

<script>
  async function loadProjects() {
    let data = [];
    try {
      data = await fetch("projects/index.json?v=" + Date.now(), { cache: "no-store" })
        .then(r => r.json());
    } catch {
      return;
    }

    // ── populate header stats
    const total = data.length;
    const active = data.filter(p => (p.status || "active") === "active").length;
    const langs = [...new Set(data.map(p => p.lang || "unknown"))];
    const langCount = langs.reduce((acc, l) => {
      acc[l] = (acc[l] || 0) + data.filter(p => (p.lang || "unknown") === l).length;
      return acc;
    }, {});
    const primary = Object.entries(langCount).sort((a, b) => b[1] - a[1])[0]?.[0] || "—";

    document.getElementById("ps-count").textContent   = total;
    document.getElementById("ps-active").textContent  = active;
    document.getElementById("ps-langs").textContent   = langs.length;
    document.getElementById("ps-primary").textContent = primary;

    // ── render cards
    const grid = document.getElementById("proj-grid");
    grid.innerHTML = "";

    data.forEach((p, idx) => {
      const status = p.status || "active";
      const tags   = p.tags || [];
      const lang   = p.lang || "code";
      const slug   = (p.repo || "").replace(/^https?:\/\/(www\.)?github\.com\//, "");
      const langColors = {
        python: "#c9a45d", rust: "#c97c5d", javascript: "#d4c478",
        typescript: "#6da9c9", go: "#6db3b0", c: "#b08fb0", "c++": "#b08fb0",
        java: "#c98f5d", ruby: "#c96d6d", shell: "#8fae6f"
      };
      const dotColor = langColors[lang.toLowerCase()] || "var(--accent)";

      const card = document.createElement("a");
      card.className = "proj-card pc-anim-init";
      card.href = p.repo;
      card.target = "_blank";
      card.rel = "noopener";
      card.dataset.search = (
        (p.name || "") + " " +
        (p.intro || "") + " " +
        tags.join(" ") + " " +
        lang
      ).toLowerCase();

      card.innerHTML = `
        <div class="pc-head">
          <span class="pc-dot" style="color:${dotColor}"></span>
          <span class="pc-name">${p.name}</span>
          <span class="pc-status ${status}">${status}</span>
        </div>
        <div class="pc-intro">${(p.intro || "").trim()}</div>
        <div class="pc-meta">
          <span class="lang">${lang}</span>
          ${tags.map(t => `<span class="mid">·</span><span class="tag">${t}</span>`).join("")}
        </div>
        <div class="pc-foot">
          <span class="pc-slug">${slug}</span>
          <span class="pc-open">open <span class="arr">↗</span></span>
        </div>
      `;
      grid.appendChild(card);
    });

    // stagger reveal
    requestAnimationFrame(() => {
      document.querySelectorAll(".proj-card.pc-anim-init").forEach((c, i) => {
        setTimeout(() => {
          c.classList.remove("pc-anim-init");
          c.classList.add("pc-anim-in");
        }, 80 + i * 70);
      });
    });

    // live filter
    const input = document.getElementById("proj-grep");
    input.addEventListener("input", e => {
      const q = e.target.value.trim().toLowerCase();
      let visible = 0;
      document.querySelectorAll(".proj-card").forEach(c => {
        const match = !q || c.dataset.search.includes(q);
        c.classList.toggle("proj-hidden", !match);
        if (match) visible++;
      });
    });
    input.addEventListener("keydown", e => {
      if (e.key === "Escape") {
        input.value = "";
        input.dispatchEvent(new Event("input"));
        input.blur();
      }
    });
    document.addEventListener("keydown", e => {
      if (e.key === "/" && document.activeElement !== input) {
        e.preventDefault();
        input.focus();
      }
    });
  }

  document.addEventListener("DOMContentLoaded", loadProjects);
</script>

</body>
</html>
