name: Weekly visit-count snapshot

on:
  schedule:
    # Mondays at 09:00 UTC (~14:30 IST). Adjust if you'd rather get it at a
    # different time — cron syntax: minute hour day-of-month month day-of-week.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current count and append to history
        run: |
          set -euo pipefail
          mkdir -p stats
          DATE=$(date -u +%Y-%m-%d)
          ISO=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          COUNT=$(curl -fsSL "https://abacus.jasoncameron.dev/get/kaushal07wick-github-io/visits" \
            | jq -r '.value // 0')

          echo "snapshot date=$DATE count=$COUNT"

          if [ ! -f stats/visits.json ]; then
            echo "[]" > stats/visits.json
          fi

          jq --arg d "$DATE" --arg ts "$ISO" --argjson c "$COUNT" \
             '. + [{date: $d, timestamp: $ts, count: $c}]' \
             stats/visits.json > stats/visits.tmp.json
          mv stats/visits.tmp.json stats/visits.json

          jq -n --arg d "$DATE" --arg ts "$ISO" --argjson c "$COUNT" \
             '{date: $d, timestamp: $ts, count: $c}' > stats/latest.json

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats/
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "stats: weekly visitor snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
